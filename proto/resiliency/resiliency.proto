syntax="proto3";

package resiliency;

import "proto/google/api/annotations.proto";
import "proto/protoc-gen-openapiv2/options/annotations.proto";

option go_package = "github.com/sisco-exp/my-grpc-proto/protogen/go/resiliency";
option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
    info: {
        title: "Course - Protobuf &gRPC";
        version: "1.0.0";
    };
    host: "localhost:8081";
    schemes: HTTP;
    produces: "application/json";
};

message ResiliencyRequest {
    // int32 min_delay_seconds = 1 [json_name="min_delay_seconds"];
    int32 min_delay_seconds = 1
    [
        json_name = "min_delay_seconds",
        (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
            description: "Minimum delay in seconds (inclusive)",
            format: "integer",
            example: "2"
        }
    ];
    // int32 max_delay_seconds = 2 [json_name="max_delay_seconds"];
    int32 max_delay_seconds = 2
    [
        json_name = "max_delay_seconds",
        (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
            description: "Maximum delay in seconds (inclusive)",
            format: "integer",
            example: "7"
        }
    ];
    // repeated uint32 status_codes = 3 [json_name="status_codes"];
    repeated uint32 status_codes = 3 
    [
        json_name = "status_codes",
        (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
            description: "Array of gRPC status code to be generated (numeric)",
        }
    ];
    
}

message ResiliencyResponse {
    // string dummy_string =1 [json_name="dummy_string"];
    string dummy_string = 1 
    [
        json_name = "dummy_string",
        (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_field) = {
            description: "Dummy string for response",
        }
    ];
}

service ResiliencyService {
    rpc UnaryResiliency (ResiliencyRequest) 
        returns (ResiliencyResponse) {
            option (google.api.http) = {
                get: "/api/resiliency/v1/unary"
            };
        }
    rpc ServerStreamingResiliency (ResiliencyRequest) 
        returns (stream ResiliencyResponse) {
            option (google.api.http) = {
                get: "/api/resiliency/v1/server_streaming/{min_delay_seconds}/{max_delay_seconds}"
            };
        }
    rpc ClientStreamingResiliency (stream ResiliencyRequest) 
        returns (ResiliencyResponse) {
            option (google.api.http) = {
                get: "/api/resiliency/v1/client_streaming"
            };
        }
    rpc BiDirectionalStreamingResiliency (stream ResiliencyRequest) 
        returns (stream ResiliencyResponse) {
            option (google.api.http) = {
                get: "/api/resiliency/v1/bidirectional_streaming"
            };
        }
}

